<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>BMW M54 Engine 3D Model</title>
  <link rel="stylesheet" href="styles/main.css">
  <!-- vendor/addons has no controls/ or postprocessing/, so those come from the installed three (same r160) -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/controls/": "./node_modules/three/examples/jsm/controls/",
      "three/addons/postprocessing/": "./node_modules/three/examples/jsm/postprocessing/",
      "three/addons/": "./vendor/addons/"
    }
  }
  </script>
</head>
<body>

  <div class="container">
    <div id="canvas-container">
      <div id="removed-parts-bar" class="removed-parts-bar">
        <div class="removed-parts-label">Removed Parts:</div>
        <div id="removed-parts-icons" class="removed-parts-icons"></div>
      </div>
    </div>

    <div class="ui-panel">
      <div class="panel-header">
        <h2 id="model-title">BMW M54 Engine</h2>
        <div class="panel-header-actions">
          <button id="load-model-btn" class="btn btn-secondary" title="Load a .glb model">Load</button>
          <button id="reset-btn" class="btn btn-primary" title="Restore all removed parts">Reset</button>
        </div>
      </div>
      <input type="file" id="model-file" accept=".glb,.gltf" style="display:none">
      <div id="model-status" class="model-status"></div>

      <div class="part-info">
        <h3 id="part-name">Engine Block</h3>
        <dl class="info-details">
          <dt>Type</dt><dd id="part-type">-</dd>
          <dt>Weight</dt><dd id="part-weight">-</dd>
          <dt>Material</dt><dd id="part-material">-</dd>
          <dt>Assembly</dt><dd id="part-assembly">-</dd>
          <dt>Part no.</dt><dd id="part-number">-</dd>
        </dl>
        <details class="relationships">
          <summary>Relationships</summary>
          <div id="part-relationships" class="relationships-list">
            <p class="placeholder">Select a part to view relationships</p>
          </div>
        </details>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="tab-parts">Parts</button>
        <button class="tab" data-tab="tab-job">Repair job</button>
        <button class="tab" data-tab="tab-view">View</button>
      </div>

      <div id="tab-parts" class="tab-body active">
        <div id="parts-list" class="parts-list"><!-- Dynamically populated --></div>
      </div>

      <div id="tab-job" class="tab-body">
        <select id="job-select"><option value="">None</option></select>
        <div class="job-nav">
          <button id="job-back" class="btn btn-secondary" disabled>Back</button>
          <button id="job-next" class="btn btn-primary" disabled>Next</button>
        </div>
        <span id="job-step"></span>
      </div>

      <div id="tab-view" class="tab-body">
        <label class="row">Explode
          <input type="range" id="explode-slider" min="0" max="1" step="0.01" value="0">
        </label>
        <label class="row">Speed
          <input type="range" id="rpm-slider" min="0" max="1" step="0.01" value="0.4">
          <span id="rpm-value"></span>
        </label>
        <label class="check"><input type="checkbox" id="run-toggle"> Run engine</label>
        <label class="check"><input type="checkbox" id="ao-toggle" checked> Ambient occlusion</label>
        <p class="hint">Drag: rotate · Scroll: zoom · Middle mouse: pan · Right-click a part: show only it</p>
      </div>
    </div>
  </div>

  <!-- Modules run in order before DOMContentLoaded: boot.js sets window.THREE/GLTFLoader, then app.js (imports src/parts/) -->
  <script type="module" src="src/boot.js"></script>
  <script type="module" src="src/app.js"></script>
  <script>
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
      document.querySelectorAll('.tab, .tab-body').forEach(e => e.classList.remove('active'));
      t.classList.add('active');
      document.getElementById(t.dataset.tab).classList.add('active');
    }));
  </script>
</body>
</html>
